
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | HSN Philippines</title>
    <link rel="stylesheet" href="career.css">
</head>
<body>

    <header class="career-header">
        <div class="career-header-content">
            <h1>Build Your Future With Us</h1>
            <p>Explore career opportunities at HSN Philippines.</p>
        </div>
    </header>

    <main class="career-container">
        <div class="career-section-heading">
            <h2>Open Positions</h2>
            <p>Find the opportunity that matches your skills and ambitions.</p>
        </div>

        <div id="careerListings" class="career-grid">
            <p class="career-loading">Loading available positions...</p>
        </div>
    </main>

    <div id="applicationModal" class="application-modal" aria-hidden="true">
        <div class="application-modal-content">
            <button type="button" id="closeApplicationModal"
                class="modal-close" aria-label="Close">&times;</button>

            <div class="application-heading">
                <span>CAREER APPLICATION</span>
                <h2>Apply Now</h2>
                <p id="applicationPositionTitle">Position</p>
            </div>

            <form id="applicationForm">
                <input type="hidden" id="applicationCareerId">

                <div class="form-group">
                    <label for="applicantFullName">Full Name</label>
                    <input type="text" id="applicantFullName"
                        maxlength="150" required>
                </div>

                <div class="form-group">
                    <label for="applicantContact">Contact No.</label>
                    <input type="tel" id="applicantContact"
                        maxlength="30" required>
                </div>

                <div class="form-group">
                    <label for="applicantAddress">Address</label>
                    <textarea id="applicantAddress"
                        maxlength="1000" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="applicantSalary">Expected Salary (PHP)</label>
                    <input type="number" id="applicantSalary"
                        min="1" step="0.01" placeholder="e.g. 25000" required>
                </div>

                <div class="form-group">
                    <label for="applicantResume">Resume (PDF only)</label>
                    <input type="file" id="applicantResume"
                        accept=".pdf,application/pdf" required>
                    <small>Maximum file size: 5 MB.</small>
                </div>

                <p id="applicationMessage" class="application-message"
                    role="status"></p>

                <button type="submit" id="submitApplication"
                    class="submit-application">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="career.js"></script>
</body>
</html>
